<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="brandLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="chartBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="emeraldBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1e293b" opacity="0.9"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#334155" stroke-width="1"/>

  <!-- Logo Icon -->
  <rect x="32" y="12" width="40" height="40" rx="10" fill="url(#brandLogo)"/>
  <text x="52" y="37" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">MA</text>

  <!-- Title & Subtitle -->
  <text x="84" y="32" fill="#ffffff" font-size="14" font-weight="700">Mr. Madgenino Gleanson S Arao-arao, LPT, MPA.</text>
  <text x="84" y="48" fill="#94a3b8" font-size="11" font-weight="500">Faculty Portfolio &amp; Class Monitoring System</text>

  <!-- Nav Pills -->
  <rect x="480" y="14" width="280" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="484" y="18" width="130" height="28" rx="8" fill="#334155"/>
  <text x="549" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Portfolio</text>
  <rect x="620" y="18" width="136" height="28" rx="8" fill="#4f46e5"/>
  <text x="688" y="36" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Monitoring Hub</text>

  <!-- Live Status Badge -->
  <rect x="1020" y="18" width="148" height="28" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <circle cx="1036" cy="32" r="4" fill="#34d399"/>
  <text x="1090" y="36" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">Google Sheets Live</text>

  <!-- Hero Header Banner -->
  <g filter="url(#shadow)">
    <rect x="32" y="88" width="1136" height="120" rx="20" fill="url(#heroGradient)" stroke="#312e81" stroke-width="1"/>
    
    <!-- Profile Circle Mock -->
    <circle cx="92" cy="148" r="36" fill="#6366f1" opacity="0.3"/>
    <circle cx="92" cy="148" r="30" fill="#4f46e5"/>
    <text x="92" y="154" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">MA</text>
    
    <!-- Faculty Info -->
    <rect x="144" y="112" width="260" height="20" rx="10" fill="#4338ca" opacity="0.5"/>
    <text x="154" y="126" fill="#c7d2fe" font-size="10" font-weight="700">THC 102 • Risk Management in Safety &amp; Security</text>
    <text x="144" y="152" fill="#ffffff" font-size="18" font-weight="800">Class Attendance &amp; Grade Monitoring Dashboard</text>
    <text x="144" y="172" fill="#94a3b8" font-size="12">Real-time sync with Google Sheets • Automatic GPA &amp; Attendance Tracking</text>
  </g>

  <!-- KPI Stat Cards Grid -->
  <!-- Card 1: Enrolled -->
  <g filter="url(#shadow)">
    <rect x="32" y="228" width="268" height="90" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="52" y="254" fill="#94a3b8" font-size="11" font-weight="700">TOTAL ENROLLED</text>
    <text x="52" y="290" fill="#ffffff" font-size="28" font-weight="800">40</text>
    <text x="96" y="288" fill="#64748b" font-size="12" font-weight="600">Students</text>
    <circle cx="260" cy="273" r="16" fill="#312e81"/>
    <path d="M254 273 L260 267 L266 273" stroke="#818cf8" stroke-width="2" fill="none"/>
  </g>

  <!-- Card 2: Attendance Rate -->
  <g filter="url(#shadow)">
    <rect x="322" y="228" width="268" height="90" rx="16" fill="#064e3b" opacity="0.4" stroke="#059669" stroke-width="1"/>
    <text x="342" y="254" fill="#34d399" font-size="11" font-weight="700">ATTENDANCE RATE</text>
    <text x="342" y="290" fill="#a7f3d0" font-size="28" font-weight="800">98.2%</text>
    <rect x="520" y="248" width="50" height="20" rx="6" fill="#047857"/>
    <text x="545" y="262" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">HIGH</text>
  </g>

  <!-- Card 3: Class GPA Avg -->
  <g filter="url(#shadow)">
    <rect x="612" y="228" width="268" height="90" rx="16" fill="#312e81" opacity="0.4" stroke="#4f46e5" stroke-width="1"/>
    <text x="632" y="254" fill="#a5b4fc" font-size="11" font-weight="700">CLASS GPA AVERAGE</text>
    <text x="632" y="290" fill="#c7d2fe" font-size="28" font-weight="800">88.5%</text>
    <rect x="790" y="248" width="36" height="20" rx="6" fill="#4338ca"/>
    <text x="808" y="262" fill="#a5b4fc" font-size="11" font-weight="800" text-anchor="middle">B+</text>
  </g>

  <!-- Card 4: At-Risk -->
  <g filter="url(#shadow)">
    <rect x="902" y="228" width="266" height="90" rx="16" fill="#881337" opacity="0.3" stroke="#be123c" stroke-width="1"/>
    <text x="922" y="254" fill="#fca5a5" font-size="11" font-weight="700">AT-RISK ALERTS</text>
    <text x="922" y="290" fill="#fecdd3" font-size="28" font-weight="800">2</text>
    <text x="948" y="288" fill="#fda4af" font-size="12" font-weight="600">Interventions</text>
  </g>

  <!-- Left Main Column: Attendance & Student Table -->
  <g filter="url(#shadow)">
    <rect x="32" y="338" width="720" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Table Header Toolbar -->
    <text x="52" y="370" fill="#ffffff" font-size="14" font-weight="700">Live Student Roster &amp; Attendance Logs</text>
    <rect x="420" y="352" width="160" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="432" y="370" fill="#64748b" font-size="11">🔍 Search student...</text>
    
    <rect x="590" y="352" width="142" height="28" rx="8" fill="#10b981"/>
    <text x="661" y="370" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Sync Google Sheet</text>

    <!-- Table Columns Header -->
    <rect x="48" y="392" width="688" height="32" rx="6" fill="#0f172a"/>
    <text x="64" y="412" fill="#94a3b8" font-size="11" font-weight="700">STUDENT ID</text>
    <text x="180" y="412" fill="#94a3b8" font-size="11" font-weight="700">FULL NAME</text>
    <text x="360" y="412" fill="#94a3b8" font-size="11" font-weight="700">SECTION</text>
    <text x="480" y="412" fill="#94a3b8" font-size="11" font-weight="700">STATUS</text>
    <text x="620" y="412" fill="#94a3b8" font-size="11" font-weight="700">GRADE</text>

    <!-- Row 1 -->
    <line x1="48" y1="468" x2="736" y2="468" stroke="#334155" stroke-width="1"/>
    <text x="64" y="450" fill="#cbd5e1" font-size="12" font-weight="600">PCIC 2026-0020</text>
    <text x="180" y="450" fill="#ffffff" font-size="12" font-weight="700">Jemcil Heart Acosta</text>
    <text x="360" y="450" fill="#94a3b8" font-size="12">1st Year - Block B</text>
    <rect x="480" y="434" width="70" height="22" rx="6" fill="#065f46"/>
    <text x="515" y="449" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">PRESENT</text>
    <text x="620" y="450" fill="#34d399" font-size="13" font-weight="800">92.4% (A)</text>

    <!-- Row 2 -->
    <line x1="48" y1="512" x2="736" y2="512" stroke="#334155" stroke-width="1"/>
    <text x="64" y="494" fill="#cbd5e1" font-size="12" font-weight="600">PCIC 2026-0089</text>
    <text x="180" y="494" fill="#ffffff" font-size="12" font-weight="700">Alcher Relacion Ageas</text>
    <text x="360" y="494" fill="#94a3b8" font-size="12">1st Year - Block B</text>
    <rect x="480" y="478" width="70" height="22" rx="6" fill="#065f46"/>
    <text x="515" y="493" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">PRESENT</text>
    <text x="620" y="494" fill="#818cf8" font-size="13" font-weight="800">87.0% (B)</text>

    <!-- Row 3 -->
    <line x1="48" y1="556" x2="736" y2="556" stroke="#334155" stroke-width="1"/>
    <text x="64" y="538" fill="#cbd5e1" font-size="12" font-weight="600">PCIC 2026-0104</text>
    <text x="180" y="538" fill="#ffffff" font-size="12" font-weight="700">Maria Santos Cruz</text>
    <text x="360" y="538" fill="#94a3b8" font-size="12">1st Year - Block B</text>
    <rect x="480" y="522" width="70" height="22" rx="6" fill="#78350f"/>
    <text x="515" y="537" fill="#fde047" font-size="10" font-weight="700" text-anchor="middle">LATE</text>
    <text x="620" y="538" fill="#818cf8" font-size="13" font-weight="800">83.5% (B)</text>

    <!-- Row 4 -->
    <line x1="48" y1="600" x2="736" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="64" y="582" fill="#cbd5e1" font-size="12" font-weight="600">PCIC 2026-0142</text>
    <text x="180" y="582" fill="#ffffff" font-size="12" font-weight="700">John Patrick Reyes</text>
    <text x="360" y="582" fill="#94a3b8" font-size="12">1st Year - Block B</text>
    <rect x="480" y="566" width="70" height="22" rx="6" fill="#881337"/>
    <text x="515" y="581" fill="#fda4af" font-size="10" font-weight="700" text-anchor="middle">ABSENT</text>
    <text x="620" y="582" fill="#f87171" font-size="13" font-weight="800">68.0% (D)</text>

    <!-- Row 5 -->
    <line x1="48" y1="644" x2="736" y2="644" stroke="#334155" stroke-width="1"/>
    <text x="64" y="626" fill="#cbd5e1" font-size="12" font-weight="600">PCIC 2026-0210</text>
    <text x="180" y="626" fill="#ffffff" font-size="12" font-weight="700">Bea Angela Diaz</text>
    <text x="360" y="626" fill="#94a3b8" font-size="12">1st Year - Block B</text>
    <rect x="480" y="610" width="70" height="22" rx="6" fill="#065f46"/>
    <text x="515" y="625" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">PRESENT</text>
    <text x="620" y="626" fill="#34d399" font-size="13" font-weight="800">95.1% (A)</text>
  </g>

  <!-- Right Side Column: Chart & Grade Analytics -->
  <g filter="url(#shadow)">
    <rect x="768" y="338" width="400" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="788" y="370" fill="#ffffff" font-size="14" font-weight="700">Grade Distribution Breakdown</text>
    <text x="788" y="388" fill="#64748b" font-size="11">Class Assessment Averages (%)</text>

    <!-- Mock Bar Chart -->
    <g transform="translate(788, 410)">
      <!-- Gridlines -->
      <line x1="0" y1="200" x2="360" y2="200" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="150" x2="360" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
      <line x1="0" y1="100" x2="360" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
      <line x1="0" y1="50" x2="360" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

      <!-- Bars -->
      <!-- Quiz 1 -->
      <rect x="25" y="40" width="45" height="160" rx="6" fill="url(#chartBarGrad)"/>
      <text x="47" y="30" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">88%</text>
      <text x="47" y="220" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Quiz 1</text>

      <!-- Quiz 2 -->
      <rect x="95" y="32" width="45" height="168" rx="6" fill="url(#chartBarGrad)"/>
      <text x="117" y="22" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">90%</text>
      <text x="117" y="220" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Quiz 2</text>

      <!-- Midterm -->
      <rect x="165" y="48" width="45" height="152" rx="6" fill="url(#chartBarGrad)"/>
      <text x="187" y="38" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">86%</text>
      <text x="187" y="220" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Midterm</text>

      <!-- Project -->
      <rect x="235" y="20" width="45" height="180" rx="6" fill="url(#emeraldBarGrad)"/>
      <text x="257" y="10" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">94%</text>
      <text x="257" y="220" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Project</text>

      <!-- Final -->
      <rect x="305" y="36" width="45" height="164" rx="6" fill="url(#chartBarGrad)"/>
      <text x="327" y="26" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">89%</text>
      <text x="327" y="220" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Final</text>
    </g>

    <!-- Bottom Stat Summary Pill -->
    <rect x="788" y="680" width="360" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="808" y="705" fill="#94a3b8" font-size="11" font-weight="600">Target Passing Rate: 75%</text>
    <text x="808" y="725" fill="#34d399" font-size="12" font-weight="700">✓ Current Pass Rate: 95.0% (Exceeds Goal)</text>
  </g>
</svg>
